name: Build LaTeX

on:
  push:
    branches: [main]
    paths: ['resume/**', '.github/workflows/main.yml', '.github/scripts/**']
  pull_request:
    paths: ['resume/**', '.github/workflows/main.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      company:
        description: 'Optional: company for a tailored cover letter'
        required: false
        default: ''
      position:
        description: 'Optional: job title for the tailored cover letter'
        required: false
        default: ''
      letter_role:
        description: 'Cover letter template'
        type: choice
        options: [ai, cloud]
        default: ai

# Only one build/deploy at a time; a newer push supersedes a running one.
concurrency:
  group: build-latex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Every file listed here is compiled; a LaTeX error fails the job
      # (nothing is deployed), so a broken edit can never replace the live PDFs.
      - name: Compile resumes and cover letters
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: |
            krishnakishore.tex
            krishnakishore-cloud.tex
            cover-letter-ai.tex
            cover-letter-cloud.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Validate PDFs
        run: |
          set -euo pipefail
          cd resume
          for f in krishnakishore krishnakishore-cloud cover-letter-ai cover-letter-cloud; do
            test -s "$f.pdf" || { echo "::error::$f.pdf missing or empty"; exit 1; }
            file "$f.pdf" | grep -q ' PDF ' || { echo "::error::$f.pdf is not a PDF"; exit 1; }
            if command -v pdfinfo >/dev/null; then
              pages=$(pdfinfo "$f.pdf" | awk '/^Pages:/{print $2}')
              echo "$f.pdf: $pages page(s)"
              case "$f" in
                cover-letter-*) max=1 ;;
                *) max=2 ;;
              esac
              if [ "$pages" -gt "$max" ]; then
                echo "::warning::$f.pdf has $pages pages (expected at most $max)"
              fi
            fi
          done

      # Run manually (Actions tab > Run workflow) with a company/position to get a
      # tailored cover letter as a downloadable artifact. It is NOT published.
      - name: Prepare tailored cover letter
        if: github.event_name == 'workflow_dispatch' && inputs.company != ''
        env:
          COMPANY: ${{ inputs.company }}
          POSITION: ${{ inputs.position }}
          LETTER_ROLE: ${{ inputs.letter_role }}
        run: |
          python3 .github/scripts/make_letter.py
          cat resume/cover-letter-custom.tex

      - name: Compile tailored cover letter
        if: github.event_name == 'workflow_dispatch' && inputs.company != ''
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: cover-letter-custom.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload tailored cover letter
        if: github.event_name == 'workflow_dispatch' && inputs.company != ''
        uses: actions/upload-artifact@v4
        with:
          name: tailored-cover-letter
          path: resume/cover-letter-custom.pdf
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            resume/krishnakishore.pdf
            resume/krishnakishore-cloud.pdf
            resume/cover-letter-ai.pdf
            resume/cover-letter-cloud.pdf
          if-no-files-found: error

  deploy:
    # Only pushes to main publish; pull requests just build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deploy

      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cp -f pdfs/*.pdf deploy/
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ./*.pdf
          # No-op when the PDFs are byte-identical, instead of failing the run.
          if git diff --cached --quiet; then
            echo "PDFs unchanged; nothing to deploy."
            exit 0
          fi
          git commit -m "[github actions] deploy ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin gh-pages
          done
          echo "::error::push to gh-pages failed"; exit 1
